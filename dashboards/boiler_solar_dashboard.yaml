title: Boiler Solar
path: boiler-solar
icon: mdi:water-boiler
badges: []
cards:
  - type: markdown
    content: |
      ## Boiler Solar Controller
      Panou clar pentru control, monitorizare si alerta rapida.
  - type: grid
    columns: 3
    square: false
    cards:
      - type: tile
        entity: sensor.boiler_solar_controller_retea_consum_injectie
        name: Retea
        icon: mdi:transmission-tower
        card_mod:
          style: |
            ha-card {
              {% set value = states(config.entity) | float(0) %}
              {% if value > 10 %}
                --tile-dyn-color: red;
              {% elif value > 1 %}
                --tile-dyn-color: deepskyblue;
              {% elif value < 1 %}
                --tile-dyn-color: lightgreen;
              {% else %}
                --tile-dyn-color: var(--state-icon-color);
              {% endif %}
              --tile-color: var(--tile-dyn-color) !important;
              --card-mod-icon-color: var(--tile-dyn-color) !important;
            }
            ha-tile-icon$ ha-state-icon {
              color: var(--tile-dyn-color) !important;
            }
      - type: tile
        entity: sensor.boiler_solar_controller_productie_solara
        name: Productie
        icon: mdi:solar-power
        card_mod:
          style: |
            ha-card {
              {% set value = states(config.entity) | float(0) %}
              {% if value > 10 %}
                --tile-dyn-color: lightgreen;
              {% elif value > 1 %}
                --tile-dyn-color: deepskyblue;
              {% elif value < 1 %}
                --tile-dyn-color: red;
              {% else %}
                --tile-dyn-color: var(--state-icon-color);
              {% endif %}
              --tile-color: var(--tile-dyn-color) !important;
              --card-mod-icon-color: var(--tile-dyn-color) !important;
            }
            ha-tile-icon$ ha-state-icon {
              color: var(--tile-dyn-color) !important;
            }
      - type: tile
        entity: sensor.boiler_solar_controller_tensiune_retea
        name: Tensiune
        icon: mdi:lightning-bolt
        card_mod:
          style: |
            ha-card {
              {% set value = states(config.entity) | float(0) %}
              {% if value > 250 %}
                --tile-dyn-color: red;
              {% elif value > 245 %}
                --tile-dyn-color: deepskyblue;
              {% elif value < 245 %}
                --tile-dyn-color: lightgreen;
              {% else %}
                --tile-dyn-color: var(--state-icon-color);
              {% endif %}
              --tile-color: var(--tile-dyn-color) !important;
              --card-mod-icon-color: var(--tile-dyn-color) !important;
            }
            ha-tile-icon$ ha-state-icon {
              color: var(--tile-dyn-color) !important;
            }
  - type: entity-filter
    entities:
      - sensor.boiler_solar_controller_tensiune_retea
    state_filter:
      - operator: ">"
        value: 250
    card:
      type: glance
      title: Alerta supratensiune
      show_name: true
      show_state: true
      show_icon: true
  - type: grid
    columns: 2
    square: false
    cards:
      - type: entities
        title: Boiler 1
        show_header_toggle: false
        state_color: true
        entities:
          - entity: switch.boiler_solar_controller_control_automat_boiler_1
            name: Automat
          - entity: select.boiler_solar_controller_temperatura_maxima_boiler_1
            name: Temp. max
          - entity: number.boiler_solar_controller_putere_nominala_boiler_1
            name: Putere (W)
          - entity: sensor.boiler_solar_controller_status_boiler_1
            name: Status
          - entity: sensor.boiler_solar_controller_consum_boiler_1
            name: Consum
            card_mod:
              style: |
                :host {
                  {% set value = states(config.entity) | float(0) %}
                  {% if value > 10 %}
                    color: red;
                  {% elif value > 1 %}
                    color: deepskyblue;
                  {% elif value < 1 %}
                    color: lightgreen;
                  {% endif %}
                }
          - entity: sensor.boiler_solar_controller_temperatura_boiler_1
            name: Temperatura
            card_mod:
              style: |
                :host {
                  {% set value = states(config.entity) | float(0) %}
                  {% if value < 40 %}
                    color: deepskyblue;
                  {% elif value <= 70 %}
                    color: gold;
                  {% else %}
                    color: red;
                  {% endif %}
                }
      - type: entities
        title: Boiler 2
        show_header_toggle: false
        state_color: true
        entities:
          - entity: switch.boiler_solar_controller_control_automat_boiler_2
            name: Automat
          - entity: select.boiler_solar_controller_temperatura_maxima_boiler_2
            name: Temp. max
          - entity: number.boiler_solar_controller_putere_nominala_boiler_2
            name: Putere (W)
          - entity: sensor.boiler_solar_controller_status_boiler_2
            name: Status
          - entity: sensor.boiler_solar_controller_consum_boiler_2
            name: Consum
            card_mod:
              style: |
                :host {
                  {% set value = states(config.entity) | float(0) %}
                  {% if value > 10 %}
                    color: red;
                  {% elif value > 1 %}
                    color: deepskyblue;
                  {% elif value < 1 %}
                    color: lightgreen;
                  {% endif %}
                }
          - entity: sensor.boiler_solar_controller_temperatura_boiler_2
            name: Temperatura
            card_mod:
              style: |
                :host {
                  {% set value = states(config.entity) | float(0) %}
                  {% if value < 40 %}
                    color: deepskyblue;
                  {% elif value <= 70 %}
                    color: gold;
                  {% else %}
                    color: red;
                  {% endif %}
                }
  - type: entities
    title: Setari generale solar
    show_header_toggle: false
    entities:
      - entity: number.boiler_solar_controller_prag_minim_surplus_solar
        name: Prag minim surplus
      - entity: number.boiler_solar_controller_prag_supratensiune
        name: Prag supratensiune
      - entity: datetime.boiler_solar_controller_deadline_program_solar
        name: Deadline program
      - entity: select.boiler_solar_controller_temperatura_program_solar
        name: Temp. program
      - entity: sensor.boiler_solar_controller_program_solar
        name: Program solar
  - type: entities
    title: Fereastra solara zilnica
    show_header_toggle: false
    entities:
      - entity: select.boiler_solar_controller_start_fereastra_solara
        name: Start fereastra
      - entity: select.boiler_solar_controller_sfarsit_fereastra_solara
        name: Sfarsit fereastra
      - type: section
        label: "Interval activ: suprim\u0103 histereza pana la atingerea targetului"
    card_mod:
      style: |
        ha-card {
          border-left: 3px solid var(--state-active-color, orange);
        }
  - type: grid
    columns: 2
    square: false
    cards:
      - type: gauge
        entity: sensor.boiler_solar_controller_temperatura_boiler_1
        name: Temp Boiler 1
        min: 20
        max: 90
        severity:
          green: 20
          yellow: 60
          red: 80
      - type: gauge
        entity: sensor.boiler_solar_controller_temperatura_boiler_2
        name: Temp Boiler 2
        min: 20
        max: 90
        severity:
          green: 20
          yellow: 60
          red: 80
  - type: markdown
    title: Jurnal - Activitate Recenta
    content: >-
      {{ state_attr('sensor.boiler_solar_controller_jurnal_diagnostic', 'log') |
      replace('

      ', '

      ') }}
  - type: history-graph
    title: Activitate boilere + supratensiune (6h)
    hours_to_show: 6
    refresh_interval: 30
    entities:
      - entity: sensor.boiler_solar_controller_consum_boiler_1
        name: Boiler 1 (consum)
      - entity: sensor.boiler_solar_controller_consum_boiler_2
        name: Boiler 2 (consum)
      - entity: sensor.boiler_solar_controller_tensiune_retea
        name: Tensiune retea
      - entity: number.boiler_solar_controller_prag_supratensiune
        name: Prag supratensiune
